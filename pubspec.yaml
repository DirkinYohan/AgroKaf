name: agrokaf
description: "AgroKaf - Aplicación para la detección temprana de Muerte Descendente en plantas de café mediante Inteligencia Artificial."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  image_picker: ^1.2.4
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6
  sqflite_sqlcipher: ^3.4.1
  flutter_secure_storage: ^11.2.0
  image: ^4.12.0
  app_settings: ^9.0.1
  package_info_plus: ^10.2.2
  intl: ^0.20.3
  flutter_litert: 3.10.0
  image_cropper: 13.0.0
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4
  flutter_native_splash: 2.4.8
  sqflite_common_ffi: 2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/model/
  fonts:
    # Inter (SIL Open Font License, see assets/fonts/inter/OFL.txt).
    # Bundled so the app never downloads fonts: it must work 100% offline.
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-400.ttf
          weight: 400
        - asset: assets/fonts/inter/Inter-500.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-600.ttf
          weight: 600
        - asset: assets/fonts/inter/Inter-700.ttf
          weight: 700

# ---------------------------------------------------------------------------
# Branding generators (run once after changing the images):
#   dart run flutter_launcher_icons
#   dart run flutter_native_splash:create
# ---------------------------------------------------------------------------
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/branding/app_icon_foreground.png
  min_sdk_android: 23
  remove_alpha_ios: true

flutter_native_splash:
  color: "#FAFAF7"
  image: assets/branding/splash_logo.png
  android_12:
    color: "#FAFAF7"
    image: assets/branding/splash_android12.png
  web: false
